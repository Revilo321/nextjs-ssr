models:
  Post: # models must be singular and CamelCased
    belongsTo: [User] # Relations will be used in REST and GraphQL
    hasMany: [Comment]
    count: 50 # generate 50 items
    fake:
      userId: { int: [1, 2] }
      title: loremWords # faker methods
      body: { loremWords: [3, 10] } # but you can pass arguments for some

  Comment:
    belongsTo: [Post]
    count: 100
    fake:
      email: email
      body: loremWords'
    data:
      [
        { postId: 1 },
        { postId: 2 },
        { postId: 1 },
        { postId: 2 },
        { postId: 3 },
        { postId: 3 },
        { postId: 1 },
        { postId: 2 },
        { postId: 3 },
        { postId: 3 },
      ]

  User:
    hasMany: [Post]
    data: [{ name: Alice }, { name: Oliver }] # create a single user
