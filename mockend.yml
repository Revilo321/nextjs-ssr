models:
  Post: # models must be singular and CamelCased
    belongsTo: [User] # Relations will be used in REST and GraphQL
    hasMany: [Comment]
    count: 50 # generate 50 items
    fake:
      body: { loremWords: [3, 10] } # but you can pass arguments for some
    data: [
        {
          title: "This is my first post about Dreamplan, im so happy",
          userId: 1,
        }, # update title for post#1
        { title: "Dreamplan is great, here's why!", userId: 2 }, # update title for post#2
      ]

  Comment:
    belongsTo: [Post]
    count: 100
    fake:
      email: email
      body: loremWords'
    data:
      [
        { postId: 1 },
        { postId: 2 },
        { postId: 1 },
        { postId: 2 },
        { postId: 3 },
        { postId: 3 },
        { postId: 1 },
        { postId: 2 },
        { postId: 3 },
        { postId: 3 },
      ]

  User:
    hasMany: [Post]
    data: [{ name: Alice }, { name: Oliver }] # create a single user
